<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-yellow-100/30 flex items-center justify-center min-h-screen px-4 sm:px-0 font-sans text-gray-800">
    <div
        class="bg-white p-6 sm:p-8 rounded-xl shadow-lg w-full max-w-sm sm:max-w-md transition-all duration-300 border-2 border-red-400">
        <div class="flex justify-center mb-6">
            <a href="index.html" class="text-2xl font-extrabold text-sky-600 flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M13 10V3L4 14h7v7l9-11h-7z" />
                </svg>
                Quiz Trip
            </a>
        </div>
        <h2 class="text-2xl sm:text-3xl font-extrabold text-center text-gray-900 mb-4">Reset Password</h2>
        <p class="text-sm font-medium text-gray-600 text-center mb-6">
            Enter your email address and we'll send you a link to reset your password.
        </p>
        <form id="forgot-password-form">
            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="email">
                    Email address:
                </label>
                <input
                    class="shadow-sm appearance-none border-2 border-sky-300 rounded-lg w-full py-2 sm:py-3 px-4 text-gray-700 leading-tight focus:outline-none focus:ring-0 focus:border-red-400 transition-all duration-200"
                    id="email" type="email" placeholder="name@example.com">
            </div>
            <div class="flex items-center justify-between">
                <button
                    class="bg-red-500 hover:bg-red-400 text-white font-bold py-2 sm:py-3 px-4 rounded-lg focus:outline-none w-full transition-all duration-300 shadow-md"
                    type="submit">
                    Send Reset Link
                </button>
            </div>
        </form>
        <p class="mt-6 text-center text-sm font-medium text-gray-600">
            Remember your password?
            <a href="login.html" class="text-sky-600 hover:text-red-500 font-bold transition-colors">Sign in</a>
        </p>
    </div>
</body>

</html>
