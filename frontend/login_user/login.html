<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login</title>
    <link rel="stylesheet" href="main.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen px-4 sm:px-0">

    <div class="bg-white p-6 sm:p-8 rounded-xl shadow-lg w-full max-w-sm sm:max-w-md transition-all duration-300">

        <h2 class="text-2xl sm:text-3xl font-extrabold text-center text-gray-800 mb-6">User login</h2>

        <form id="login-form">
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="email">
                    Email address:
                </label>
                <input
                    class="shadow-sm appearance-none border border-gray-300 rounded-lg w-full py-2 sm:py-3 px-4 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200"
                    id="email" type="text" placeholder="name@example.com">
                <p id="email-error" class="text-red-500 text-xs italic mt-1 hidden">Invalid email address.</p>
            </div>

            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="password">
                    Password:
                </label>
                <input
                    class="shadow-sm appearance-none border border-gray-300 rounded-lg w-full py-2 sm:py-3 px-4 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200"
                    id="password" type="password" placeholder="********">
                <p id="password-error" class="text-red-500 text-xs italic mt-1 hidden">Incorrect password.</p>

                <div class="text-right mt-2">
                    <a href="forgot-password.html" class="text-sm text-blue-500 hover:text-blue-700 hover:underline">Forgot password?</a>
                </div>
            </div>

            <div class="flex items-center justify-between">
                <button
                    class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 sm:py-3 px-4 rounded-lg focus:outline-none focus:ring-4 focus:ring-blue-300 w-full transition-all duration-300"
                    type="submit">
                    Sign in
                </button>
            </div>
        </form>

        <p class="mt-6 text-center text-sm text-gray-600">
            Don't have an account? <a href="signup.html"
                class="text-blue-500 hover:text-blue-700 font-semibold hover:underline">Sign up</a>
        </p>
    </div>

    <script>
        const form = document.getElementById('login-form');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const emailError = document.getElementById('email-error');
        const passwordError = document.getElementById('password-error');

        form.addEventListener('submit', function (e) {
            e.preventDefault();

            emailInput.classList.remove('border-red-500', 'focus:ring-red-500', 'bg-red-50');
            emailInput.classList.add('border-gray-300', 'focus:ring-blue-500');
            emailError.classList.add('hidden');

            passwordInput.classList.remove('border-red-500', 'focus:ring-red-500', 'bg-red-50');
            passwordInput.classList.add('border-gray-300', 'focus:ring-blue-500');
            passwordError.classList.add('hidden');

            let isValid = true;

            if (!emailInput.value.includes('@') || !emailInput.value.includes('.')) {
                emailInput.classList.remove('border-gray-300', 'focus:ring-blue-500');
                emailInput.classList.add('border-red-500', 'focus:ring-red-500', 'bg-red-50');
                emailError.classList.remove('hidden');
                isValid = false;
            }

            if (passwordInput.value.length < 6) {
                passwordInput.classList.remove('border-gray-300', 'focus:ring-blue-500');
                passwordInput.classList.add('border-red-500', 'focus:ring-red-500', 'bg-red-50');
                passwordError.classList.remove('hidden');
                isValid = false;
            }

            if (isValid) {
                alert('Sign in successful!');
            }
        });
    </script>
</body>

</html>
