<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="main.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen px-4 sm:px-0">

    <div class="bg-white p-6 sm:p-8 rounded-xl shadow-lg w-full max-w-sm sm:max-w-md transition-all duration-300">
        <h2 class="text-2xl sm:text-3xl font-extrabold text-center text-gray-800 mb-4">Reset Password</h2>

        <p class="text-sm text-gray-600 text-center mb-6">
            Enter your email address and we'll send you a link to reset your password.
        </p>

        <form id="forgot-password-form">
            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="email">
                    Email address:
                </label>
                <input
                    class="shadow-sm appearance-none border border-gray-300 rounded-lg w-full py-2 sm:py-3 px-4 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200"
                    id="email" type="email" placeholder="name@example.com">
            </div>

            <div class="flex items-center justify-between">
                <button
                    class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 sm:py-3 px-4 rounded-lg focus:outline-none focus:ring-4 focus:ring-blue-300 w-full transition-all duration-300"
                    type="submit">
                    Send Reset Link
                </button>
            </div>
        </form>

        <p class="mt-6 text-center text-sm text-gray-600">
            Remember your password?
            <a href="login.html" class="text-blue-500 hover:text-blue-700 font-semibold hover:underline">Sign in</a>
        </p>
    </div>

</body>

</html>
