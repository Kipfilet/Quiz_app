<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Trip - Question Categories</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-yellow-100/30 font-sans text-gray-800">

    <nav class="fixed top-0 w-full bg-white shadow-md z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">

                <div class="flex-shrink-0 flex items-center">
                    <a class="text-xl sm:text-2xl font-extrabold text-sky-600 flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 sm:h-8 sm:w-8" fill="none"
                            viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M13 10V3L4 14h7v7l9-11h-7z" />
                        </svg>
                        Quiz Trip
                    </a>
                </div>

                <div class="hidden md:flex gap-4 items-center">
                    <a href="home.html" class="text-gray-600 hover:text-sky-600 px-3 py-2 font-medium transition-colors">Home</a>
                    <a href="#"
                        class="text-sky-600 border-b-2 border-sky-600 px-3 py-2 font-semibold">Categories</a>
                    <a href="leaderboard_logout.html"
                        class="text-gray-600 hover:text-sky-600 px-3 py-2 font-medium transition-colors">Leaderboard</a>
                    <a href="signin_user.html"
                        class="text-gray-600 hover:text-sky-600 px-3 py-2 font-medium transition-colors">Rules</a>
                </div>

                <div class="hidden md:flex items-center space-x-4">
                    <a href="singin_user.html"
                        class="text-gray-600 hover:text-sky-600 font-medium transition-colors">Sign
                        in</a>
                    <a href="signup_user.html"
                        class="bg-sky-600 hover:opacity-90 text-white px-5 py-2 rounded-lg font-bold transition-all duration-300 shadow-md">Sign
                        up</a>
                </div>

                <div class="md:hidden flex items-center">
                    <button id="mobile-menu-button" class="text-sky-600 focus:outline-none p-2">
                        <svg class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 6h16M4 12h16M4 18h16" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <div id="mobile-menu" class="hidden md:hidden bg-white border-t border-sky-300 shadow-lg absolute w-full">
            <div class="px-4 pt-2 pb-6 space-y-2">
                <a href="home.html" class="block px-3 py-3 text-base font-medium text-gray-700 hover:bg-yellow-100 rounded-md">Home</a>
                <a href="rules2.html"
                    class="block px-3 py-3 text-base font-medium text-gray-700 hover:bg-yellow-100 rounded-md">Rules</a>
                <a href="leaderboard_logout.html"
                    class="block px-3 py-3 text-base font-medium text-gray-700 hover:bg-yellow-100 rounded-md">Leaderboard</a>
                <hr class="my-2 border-gray-200">
                <a href="singin_user.html"
                    class="block px-3 py-3 text-base font-medium text-gray-700 hover:bg-yellow-100 rounded-md">Sign
                    in</a>
                <a href="signup_user.html"
                    class="block px-3 py-3 text-base font-medium text-white bg-sky-600 hover:opacity-90 rounded-md text-center mt-2">Sign
                    up</a>
            </div>
        </div>
    </nav>

    <main class="pt-24 sm:pt-28 pb-12 px-4 sm:px-6 lg:px-8 max-w-5xl mx-auto min-h-screen">

        <div class="mb-10 text-center">
            <h1 class="text-3xl sm:text-5xl font-extrabold text-gray-900 tracking-tight mb-4">
                Question Database
            </h1>
            <p class="text-gray-600 text-sm sm:text-lg font-medium max-w-2xl mx-auto">
                Browse all available questions divided by categories. The correct answer is marked with a checkmark (✓).
            </p>
        </div>

        <div id="accordion-container" class="space-y-4">
            <p class="text-gray-500 text-sm font-medium text-center">Loading categories…</p>
        </div>

    </main>

    <footer class="bg-white border-t border-sky-300 mt-12 py-8">
        <div class="max-w-7xl mx-auto px-4 text-center text-gray-500 text-sm font-medium">
            &copy; 2026 Quiz Trip. All rights reserved.
        </div>
    </footer>

    <script src="source/api.js"></script>
    <script src="source/categories.js"></script>
    <script>
        const btn = document.getElementById('mobile-menu-button');
        const menu = document.getElementById('mobile-menu');

        btn.addEventListener('click', () => {
            menu.classList.toggle('hidden');
        });

        (async () => {
            const user = await guardLoggedOut('categories.html');
            loadCategoryAccordion();
        })();
    </script>
</body>

</html>
