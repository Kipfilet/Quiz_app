<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
</head>
<body>
    <div class="navbar bg-blue-500 shadow-sm">
        <div class="navbar-start  gap-2">
            <a href="index.html"><img src="/slike/logo.jpg" alt="logo" class="size-8"></a>
        </div>
        <div class="navbar-center hidden lg:flex">
            <ul class="menu menu-horizontal gap-4 px-1">
                <li><a href="#"
                        class="text-xl text-white bg-blue-500 hover:bg-blue-600 p-2 rounded-2xl"><b>Play</b></a></li>
                <li><a href="#"
                        class="text-xl text-white bg-blue-500 hover:bg-blue-600 p-2 rounded-2xl"><b>Leaderboard</b></a></li>
                <li><a href="#"
                        class="text-xl text-white bg-blue-500 hover:bg-blue-600 p-2 rounded-2xl"><b>Rules</b></a></li>
            </ul>
        </div>
        <div class="navbar-end">
            <div class="dropdown dropdown-end bg-blue-500 lg:hidden">
                <div tabindex="0" role="button"
                    class="btn bg-blue-500 border-blue-500 shadow-none ">
                    <img src="/frontend/images/pfp.jpg" class="size-8">
                </div>
                <ul tabindex="-1" class="menu menu-sm dropdown-content bg-blue-500 rounded-box z-1 mt-3 w-52 px-1">
                    <li><a href="#"
                        class="text-xl text-white bg-blue-500 hover:bg-blue-600 p-2 lg:hidden rounded-xl"><b>Play</b></a></li>
                    <li><a href="#"
                        class="text-xl text-white bg-blue-500 hover:bg-blue-600 p-2 lg:hidden rounded-xl"><b>Leaderboard</b></a></li>
                    <li><a href="#"
                        class="text-xl text-white   bg-blue-500 hover:bg-blue-600 p-2 lg:hiddenrounded-xl"><b>Rules</b></a></li>
                    
                </ul>
            </div>
        </div>
    </div>
    <div class="card bg-neutral-50 mx-auto w-150 my-5 shadow-xl rounded-2xl pb-10    ">
        <div class="card-body">
            <div class="flex justify-between">
                 <div class="rating rating-xl flex justify-center gap-2 mt-5">
                <div class="mask mask-heart bg-red-600" aria-label="1 star"></div>
                <div class="mask mask-heart bg-red-600" aria-label="2 star"></div>
                <div class="mask mask-heart bg-red-600" aria-label="3 star" aria-current="true"></div>
            </div> 
            <div class="mt-5  font-bold">
                <p class="text-xl"><b>Score:</b> 25</p>
            </div>

             
            </div>
             <div class="my-5 text-center text-wrap max-w-md mx-auto">
                <h1 class="text-2xl font-semibold">Which statement correctly matches all three countries with a notable geographical feature?</h1>
            </div>
             <div class="flex justify-center "    >
                <div class="grid grid-cols-1 gap-4 w-ful max-w-4xl justify-items-center ">
                    <button class="btn text-white  bg-blue-500 hover:bg-blue-600 active:bg-blue-700 text-md w-13/20 h-16 rounded-xl">Split</button>
                    <button class="btn text-white  bg-blue-500 hover:bg-blue-600 active:bg-blue-700 text-md w-13/20 h-16 rounded-xl">Sweden - tropical rainforest; Netherlands — Himalayan mountains; Croatia — Arctic tundra</button>
                    <button class="btn text-white  bg-blue-500 hover:bg-blue-600 active:bg-blue-700 text-md w-13/20 h-16 rounded-xl">Sweden - Sahara Desert; Netherlands — Amazon River; Croatia — Great Barrier Reef</button>
                    <button class="btn text-white  bg-blue-500 hover:bg-blue-600 active:bg-blue-700 text-md w-13/20 h-16 rounded-xl">Sweden - Mediterranean islands only; Netherlands — active volcanoes; Croatia — North Sea coastline</button>
                </div>
            </div>

        </div>
    </div>
    
</body>
</html>
