<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Trip - Create Quiz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-yellow-100/30 font-sans text-gray-800">

    <nav class="fixed top-0 w-full bg-white shadow-md z-50 border-b-2 border-sky-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex-shrink-0 flex items-center">
                    <a href="home-logedin.html"
                        class="text-xl sm:text-2xl font-extrabold text-sky-600 flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 sm:h-8 sm:w-8" fill="none"
                            viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M13 10V3L4 14h7v7l9-11h-7z" />
                        </svg>
                        Quiz Trip
                    </a>
                </div>
                <div class="hidden md:flex space-x-8 items-center">
                    <a href="home-logedin.html"
                        class="text-gray-600 hover:text-sky-600 px-3 py-2 font-medium transition-colors">Home</a>
                    <a href="#" class="text-sky-600 border-b-2 border-sky-600 px-3 py-2 font-semibold">Create Quiz</a>
                </div>
                <div class="hidden md:flex items-center space-x-4">
                    <div
                        class="flex items-center gap-2 text-sm font-bold text-sky-600 bg-sky-300/30 py-1.5 px-3 rounded-full">
                        <span
                            class="w-6 h-6 bg-amber-300 text-white rounded-full flex items-center justify-center text-xs" data-user-initial>U</span>
                        <span data-user-name>User</span>
                    </div>
                    <a href="#" data-logout
                        class="text-red-500 hover:text-red-400 font-bold transition-colors flex items-center gap-1">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                        </svg>
                        Logout
                    </a>
                </div>
                <div class="md:hidden flex items-center">
                    <button id="mobile-menu-button" class="text-sky-600 focus:outline-none p-2">
                        <svg class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 6h16M4 12h16M4 18h16" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>
        <div id="mobile-menu" class="hidden md:hidden bg-white border-t border-sky-300 shadow-lg absolute w-full">
            <div class="px-4 pt-2 pb-6 space-y-2">
                <a href="home-logedin.html"
                    class="block px-3 py-3 text-base font-medium text-gray-700 hover:bg-yellow-100 rounded-md">Home</a>
                <a href="#" class="block px-3 py-3 text-base font-medium text-sky-600 bg-sky-300/30 rounded-md">Create
                    Quiz</a>
                <hr class="my-2 border-gray-200">
                <a href="#" data-logout
                    class="block px-3 py-3 text-base font-bold text-red-500 hover:bg-red-400 hover:text-white rounded-md flex items-center gap-2 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                    </svg>
                    Logout
                </a>
            </div>
        </div>
    </nav>

    <main class="pt-24 sm:pt-28 pb-12 px-4 sm:px-6 lg:px-8 max-w-3xl mx-auto min-h-screen">

        <div class="mb-8 text-center sm:text-left">
            <h1 class="text-2xl sm:text-4xl font-extrabold text-gray-900 tracking-tight">
                Create a New Quiz
            </h1>
            <p class="mt-2 text-gray-600 text-sm sm:text-base font-medium">
                Fill in the details below to publish your own quiz to Quiz Trip.
            </p>
        </div>

        <form id="create-quiz-form" class="space-y-8">
            <div class="bg-white p-6 sm:p-8 rounded-xl shadow-sm border-2 border-sky-300">
                <h2 class="text-xl font-bold text-sky-600 mb-6 border-b-2 border-yellow-100 pb-2">1. Quiz Details</h2>

                <div class="space-y-5">
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="quiz-title">
                            Quiz Title
                        </label>
                        <input
                            class="shadow-sm appearance-none border-2 border-sky-300 rounded-lg w-full py-2 sm:py-3 px-4 text-gray-700 leading-tight focus:outline-none focus:ring-0 focus:border-amber-300 transition-all duration-200"
                            id="quiz-title" type="text" placeholder="e.g., Ultimate 90s Trivia">
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                        <div>
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="quiz-category">
                                Category
                            </label>
                            <select
                                class="shadow-sm appearance-none border-2 border-sky-300 rounded-lg w-full py-2 sm:py-3 px-4 text-gray-700 leading-tight focus:outline-none focus:ring-0 focus:border-amber-300 transition-all duration-200 bg-white"
                                id="quiz-category">
                                <option value="">Loading categories…</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="quiz-difficulty">
                                Difficulty
                            </label>
                            <select
                                class="shadow-sm appearance-none border-2 border-sky-300 rounded-lg w-full py-2 sm:py-3 px-4 text-gray-700 leading-tight focus:outline-none focus:ring-0 focus:border-amber-300 transition-all duration-200 bg-white"
                                id="quiz-difficulty">
                                <option value="easy">Easy</option>
                                <option value="normal" selected>Normal</option>
                                <option value="hard">Hard</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="quiz-description">
                            Description
                        </label>
                        <textarea
                            class="shadow-sm appearance-none border-2 border-sky-300 rounded-lg w-full py-2 sm:py-3 px-4 text-gray-700 leading-tight focus:outline-none focus:ring-0 focus:border-amber-300 transition-all duration-200 h-24 resize-none"
                            id="quiz-description" placeholder="Briefly describe what this quiz is about..."></textarea>
                    </div>
                </div>
            </div>

            <div class="bg-white p-6 sm:p-8 rounded-xl shadow-sm border-2 border-amber-300">
                <div class="flex justify-between items-center mb-6 border-b-2 border-yellow-100 pb-2">
                    <h2 class="text-xl font-bold text-amber-500">2. Questions</h2>
                </div>

                <div id="questions-container" class="space-y-6"></div>

                <div class="mt-8 text-center">
                    <button type="button" id="add-question-btn"
                        class="text-sky-600 font-bold hover:text-red-500 transition-colors flex items-center justify-center gap-2 w-full border-2 border-dashed border-sky-300 rounded-lg py-3 hover:border-red-400 hover:bg-red-50">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                        </svg>
                        Add Another Question
                    </button>
                </div>
            </div>

            <p id="form-error" class="text-red-500 text-sm font-bold hidden"></p>

            <div class="flex flex-col sm:flex-row gap-4 pt-4">
                <a href="home-logedin.html"
                    class="w-full sm:w-1/3 text-center bg-white text-red-500 font-bold py-3 px-4 rounded-lg border-2 border-red-400 hover:bg-red-50 transition-all duration-300">
                    Cancel
                </a>
                <button type="submit" id="publish-btn"
                    class="w-full sm:w-2/3 bg-sky-600 hover:bg-sky-700 text-white font-bold py-3 px-4 rounded-lg shadow-md transition-all duration-300">
                    Publish Quiz
                </button>
            </div>
        </form>
    </main>

    <footer class="bg-white border-t border-sky-300 mt-12 py-8">
        <div class="max-w-7xl mx-auto px-4 text-center text-gray-500 text-sm font-medium">
            &copy; 2026 Quiz Trip. All rights reserved.
        </div>
    </footer>

    <script src="source/api.js"></script>
    <script src="source/quiz-create.js"></script>
    <script>
        const btn = document.getElementById('mobile-menu-button');
        const menu = document.getElementById('mobile-menu');

        btn.addEventListener('click', () => {
            menu.classList.toggle('hidden');
        });

        (async () => {
            const user = await guardLoggedIn('singin_user.html');
            if (user) {
                initQuizCreate();
            }
        })();
    </script>
</body>

</html>
