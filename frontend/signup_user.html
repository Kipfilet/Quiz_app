<!DOCTYPE html>

                <div class="hidden md:flex items-center gap-4">
                    <a href="signin_user.html"
                        class="text-gray-900 hover:text-sky-600 font-medium transition-colors">

                    </a>

                    <a href="signup_user.html"

        <div id="mobile-menu" class="hidden md:hidden bg-white border-t border-sky-600 shadow-lg absolute w-full">
            <div class="px-4 pt-2 pb-6 space-y-2">

    <main class="min-h-screen flex items-center justify-center px-4 pt-14 pb-2">
        <div class="mt-24 mb-10 bg-white px-6 py-6 sm:px-8 sm:py-8 rounded-xl shadow-lg w-full max-w-sm sm:max-w-md transition-all duration-300 border-2 border-[#ededed]">
            <div class="flex justify-center mb-6">
                <a href="home.html" class="text-2xl font-extrabold text-sky-600 flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M13 10V3L4 14h7v7l9-11h-7z" />
                    </svg>
                    Quiz Trip
                </a>
            </div>
            <h2 class="text-2xl sm:text-3xl font-extrabold text-center text-gray-900 mb-6">Create an account</h2>
            <form id="signup-form">
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="username">
                        Username:
                    </label>
                    <input
                        class="shadow-sm appearance-none outline-none focus:outline-none focus:border-sky-600 border-2 text-blue-400 rounded-lg w-full py-2 sm:py-3 px-4 text-gray-700 leading-tight 0 transition-all duration-200"
                        id="username" type="text" placeholder="e.g. johndoe">
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="email">
                        Email address:
                    </label>
                    <input
                        class="shadow-sm appearance-none outline-none focus:outline-none focus:border-sky-600 border-2 text-blue-400 rounded-lg w-full py-2 sm:py-3 px-4 text-gray-700 leading-tight 0 transition-all duration-200"
                        id="email" type="email" placeholder="name@example.com">
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="password">
                        Password:
                    </label>
                    <input
                        class="shadow-sm appearance-none outline-none focus:outline-none focus:border-sky-600 border-2 text-blue-400 rounded-lg w-full py-2 sm:py-3 px-4 text-gray-700 leading-tight 0 transition-all duration-200"
                        id="password" type="password" placeholder="********">
                </div>
                <div class="mb-6">
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="confirm-password">
                        Confirm Password:
                    </label>
                    <input
                        class="shadow-sm appearance-none outline-none focus:outline-none focus:border-sky-600 border-2 text-blue-400 rounded-lg w-full py-2 sm:py-3 px-4 text-gray-700 leading-tight 0 transition-all duration-200"
                        id="confirm-password" type="password" placeholder="********">
                </div>
                <p id="form-error" class="text-red-500 text-sm font-bold mb-4 hidden"></p>
                <div class="flex items-center justify-between">
                    <button
                        class="bg-sky-600 hover:bg-sky-700 text-white font-extrabold py-2 sm:py-3 px-4 rounded-lg focus:outline-none w-full transition-all duration-300 shadow-md"
                        type="submit">
                        Sign up
                    </button>
                </div>
            </form>
            <p class="mt-6 text-center text-sm font-medium text-gray-600">
                Already have an account?
                <a href="signin_user.html" class="text-sky-600 hover:text-sky-700 font-bold transition-colors">Sign in</a>
            </p>
        </div>
    </main>
    <footer class="bg-white border-t border-sky-300 mt-8 sm:mt-12 py-6 sm:py-8">

      <div class="max-w-7xl mx-auto px-4 text-center text-gray-500 text-xs sm:text-sm font-medium">

          &copy; 2026 Quiz Trip. All rights reserved.

      </div>

    </footer>

  <script src="source/api.js"></script>
  <script>
      const btn = document.getElementById('mobile-menu-button');
      const menu = document.getElementById('mobile-menu');

      if (btn && menu) {
          btn.addEventListener('click', () => {
              menu.classList.toggle('hidden');
          });
      }

      // Check whether a category was passed to the Rules page
      const params = new URLSearchParams(window.location.search);
      const category = params.get('category');

      if (category) {
        sessionStorage.setItem(`rulesSeen_${category}`, 'true');
      }

      // Button behavior
      function startQuiz() {
          if (category) {
              // A category was selected, so go directly to that quiz
              window.location.href =
                  `quiz.html?category=${encodeURIComponent(category)}`;
          } else {
              // No category was selected, so send the user to Categories
              window.location.href = 'categories.html';
          }
      }

      // Change button text depending on whether a category exists
      const startButton = document.getElementById('start-quiz-button');

      if (startButton) {
          startButton.textContent = category
              ? 'Play quiz'
              : 'Choose category';
      }

      (async () => {
          const user = await getCurrentUser();

          const setHref = (id, href) => {
              const el = document.getElementById(id);
              if (el) el.href = href;
          };

          setHref('nav-home', user ? 'home-logedin.html' : 'home.html');
          setHref('nav-categories', user ? 'categories.html' : 'categories_logout.html');
          setHref('nav-leaderboard', user ? 'leaderboard.html' : 'leaderboard_logout.html');

          setHref('mobile-nav-home', user ? 'home-logedin.html' : 'home.html');
          setHref('mobile-nav-categories', user ? 'categories.html' : 'categories_logout.html');
          setHref('mobile-nav-leaderboard', user ? 'leaderboard.html' : 'leaderboard_logout.html');

          if (user && document.getElementById('user-nav')) {
              document.getElementById('guest-nav').classList.add('hidden');
              document.getElementById('user-nav').classList.remove('hidden');
              document.getElementById('mobile-signin').classList.add('hidden');
              document.getElementById('mobile-signup').classList.add('hidden');
              document.getElementById('mobile-guest-divider').classList.add('hidden');
              document.getElementById('mobile-logout').classList.remove('hidden');

              renderUserBadge(user);
          } else if (document.getElementById('user-nav')) {
              document.getElementById('user-nav').classList.add('hidden');
          }

          // If a category was selected, get its name
          if (category) {
              try {
                  const { categories } = await apiFetch('categories.php');

                  const match = categories.find(
                      c => c.slug === category
                  );

                  if (match) {
                      document.querySelector('header h1').textContent =
                          `Before you start: ${match.name}`;
                  }
              } catch (e) {
                  // Keep the generic heading if the category lookup fails
                  console.error('Could not load category:', e);
              }
          }
      })();
  </script>
</body>
