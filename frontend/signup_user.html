<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-[#f7f7f8] flex flex-col items-center min-h-screen px-4 sm:px-0 font-sans text-gray-800">
    <nav class="fixed top-0 w-full bg-white shadow-md z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex-shrink-0 flex items-center">
                    <a href="home.html" class="text-xl sm:text-2xl font-extrabold text-sky-600 flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 sm:h-8 sm:w-8" fill="none"
                            viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M13 10V3L4 14h7v7l9-11h-7z" />
                        </svg>
                        Quiz Trip
                    </a>
                </div>
            </div>
        </div>
    </nav>
    <div
        class="bg-white p-6 sm:p-8 rounded-xl shadow-lg w-full max-w-sm sm:max-w-md transition-all duration-300 border-2 border-[#ededed]">
        <div class="flex justify-center mb-6">
            <a href="home.html" class="text-2xl font-extrabold text-sky-600 flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M13 10V3L4 14h7v7l9-11h-7z" />
                </svg>
                Quiz Trip
            </a>
        </div>
        <h2 class="text-2xl sm:text-3xl font-extrabold text-center text-gray-900 mb-6">Create an account</h2>
        <form id="signup-form">
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="username">
                    Username:
                </label>
                <input
                    class="shadow-sm appearance-none outline-none focus:outline-none focus:border-sky-600 border-2 text-blue-400 rounded-lg w-full py-2 sm:py-3 px-4 text-gray-700 leading-tight 0 transition-all duration-200"
                    id="username" type="text" placeholder="e.g. johndoe">
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="email">
                    Email address:
                </label>
                <input
                    class="shadow-sm appearance-none outline-none focus:outline-none focus:border-sky-600 border-2 text-blue-400 rounded-lg w-full py-2 sm:py-3 px-4 text-gray-700 leading-tight 0 transition-all duration-200"
                    id="email" type="email" placeholder="name@example.com">
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="password">
                    Password:
                </label>
                <input
                    class="shadow-sm appearance-none outline-none focus:outline-none focus:border-sky-600 border-2 text-blue-400 rounded-lg w-full py-2 sm:py-3 px-4 text-gray-700 leading-tight 0 transition-all duration-200"
                    id="password" type="password" placeholder="********">
            </div>
            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="confirm-password">
                    Confirm Password:
                </label>
                <input
                    class="shadow-sm appearance-none outline-none focus:outline-none focus:border-sky-600 border-2 text-blue-400 rounded-lg w-full py-2 sm:py-3 px-4 text-gray-700 leading-tight 0 transition-all duration-200"
                    id="confirm-password" type="password" placeholder="********">
            </div>
            <p id="form-error" class="text-red-500 text-sm font-bold mb-4 hidden"></p>
            <div class="flex items-center justify-between">
                <button
                    class="bg-sky-600 hover:bg-sky-700 text-white font-extrabold py-2 sm:py-3 px-4 rounded-lg focus:outline-none w-full transition-all duration-300 shadow-md"
                    type="submit">
                    Sign up
                </button>
            </div>
        </form>
        <p class="mt-6 text-center text-sm font-medium text-gray-600">
            Already have an account?
            <a href="singin_user.html" class="text-sky-600 hover:text-sky-700 font-bold transition-colors">Sign in</a>
        </p>
    </div>
    <script src="source/api.js"></script>
    <script>
        guardLoggedOut('home-logedin.html');

        const form = document.getElementById('signup-form');
        const usernameInput = document.getElementById('username');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const confirmInput = document.getElementById('confirm-password');
        const formError = document.getElementById('form-error');
        const submitButton = form.querySelector('button[type="submit"]');

        form.addEventListener('submit', async function (e) {
            e.preventDefault();
            formError.classList.add('hidden');

            if (passwordInput.value !== confirmInput.value) {
                formError.textContent = 'Passwords do not match.';
                formError.classList.remove('hidden');
                return;
            }

            submitButton.disabled = true;
            submitButton.textContent = 'Creating account...';

            try {
                await apiFetch('signup.php', {
                    method: 'POST',
                    body: JSON.stringify({
                        username: usernameInput.value,
                        email: emailInput.value,
                        password: passwordInput.value,
                        confirm_password: confirmInput.value,
                    }),
                });
                window.location.href = 'home-logedin.html';
            } catch (err) {
                formError.textContent = err.message || 'Could not create your account.';
                formError.classList.remove('hidden');
                submitButton.disabled = false;
                submitButton.textContent = 'Sign up';
            }
        });
    </script>
</body>

</html>
