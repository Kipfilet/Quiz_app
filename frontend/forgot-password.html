<body class="bg-[#f7f7f8] flex items-center justify-center min-h-screen px-4 sm:px-0 font-sans text-gray-900">

        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">

                <div class="flex-shrink-0 flex items-center">
                    <a href="home-logedin.html" class="text-xl sm:text-2xl font-extrabold text-sky-600 flex items-center gap-2">
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            class="h-6 w-6 sm:h-8 sm:w-8"
                            fill="none"
                            viewBox="0 0 24 24"
                            stroke="currentColor"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                stroke-width="2"
                                d="M13 10V3L4 14h7v7l9-11h-7z"
                            />
                        </svg>
                        Quiz Trip
                    </a>
                </div>

                <div class="hidden md:flex gap-4 items-center">
                    <a href="home-logedin.html"
                        class="text-gray-900 hover:text-sky-600 px-3 py-2 font-medium transition-colors">
                        Home
                    </a>

                    <a href="categories.html"
                        class="text-gray-900 hover:text-sky-600 px-3 py-2 font-medium transition-colors">
                        Categories
                    </a>

                    <a href="leaderboard.html"
                        class="text-gray-900 hover:text-sky-600 px-3 py-2 font-medium transition-colors">

                    </a>

                    <a href="rules2-logedin.html"
                        class="text-gray-900 hover:text-sky-600 font-medium transition-colors">
                        Rules
                    </a>
                </div>

                <div class="hidden md:flex items-center gap-4">
                    <a href="signin_user.html"
                        class="text-gray-900 hover:text-sky-600 font-medium transition-colors">
                        Sign in
                    </a>

                    <a href="signup_user.html"
                        class="bg-sky-600 hover:bg-sky-700 text-white px-5 py-2 rounded-lg font-bold transition-all duration-300 shadow-md">
                        Sign up
                    </a>
                </div>

                <div class="md:hidden flex items-center">
                    <button id="mobile-menu-button" class="text-sky-600 focus:outline-none p-2">
                        <svg class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 6h16M4 12h16M4 18h16" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <div id="mobile-menu" class="hidden md:hidden bg-white border-t border-sky-600 shadow-lg absolute w-full">
            <div class="px-4 pt-2 pb-6 space-y-2">
                <a href="home-logedin.html" class="block px-3 py-3 text-base font-medium text-gray-700 hover:bg-sky-50 rounded-md">Home</a>
                <a href="categories.html"
                    class="block px-3 py-3 text-base font-medium text-gray-700 hover:bg-sky-50 rounded-md">Categories</a>
                <a href="leaderboard.html"
                    class="block px-3 py-3 text-base font-medium text-gray-700 hover:bg-sky-50 rounded-md">Leaderboard</a>
                <a href="rules2-logedin.html"
                    class="block px-3 py-3 text-base font-medium text-gray-700 hover:bg-sky-50 rounded-md">Rules</a>
                <hr class="my-2 border-gray-200">
                <a href="signin_user.html"
                    class="block px-3 py-3 text-base font-medium text-gray-700 hover:bg-sky-50 rounded-md">Sign
                    in</a>
                <a href="signup_user.html"
                    class="block px-3 py-3 text-base font-medium text-white bg-sky-600 hover:bg-sky-700 rounded-md mt-2">Sign
                    up</a>
            </div>
        </div>
    </nav>

    <div class="bg-white p-6 sm:p-8 rounded-xl shadow-lg w-full max-w-sm sm:max-w-md transition-all duration-300 border-2 border-[#e7e7e7]">
        <div class="flex justify-center mb-6">
            <a href="home.html" class="text-2xl font-extrabold text-sky-600 flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M13 10V3L4 14h7v7l9-11h-7z" />
                </svg>
                Quiz Trip
            </a>
        </div>
        <h2 class="text-2xl sm:text-3xl font-extrabold text-center text-gray-900 mb-4">Reset Password</h2>
        <p class="text-sm font-medium text-gray-600 text-center mb-6">
            Enter your email address and we'll send you a link to reset your password.
        </p>
        <form id="forgot-password-form">
            <p id="form-message" class="text-sm font-bold mb-4 hidden"></p>
            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="email">
                    Email address:
                </label>
                <input
                    class="sshadow-sm appearance-none outline-none focus:outline-none focus:border-sky-600 border-2 text-blue-400 rounded-lg w-full py-2 sm:py-3 px-4 text-gray-700 leading-tight 0 transition-all duration-200"
                    id="email" type="email" placeholder="name@example.com">
            </div>
            <div class="flex items-center justify-between">
                <button
                    class="bg-sky-600 hover:bg-sky-700 text-white font-bold py-2 sm:py-3 px-4 rounded-lg focus:outline-none w-full transition-all duration-300 shadow-md"
                    type="submit">
                    Send Reset Link
                </button>
            </div>
        </form>
        <p class="mt-6 text-center text-sm font-medium text-gray-600">
            Remember your password?
            <a href="signin_user.html" class="text-sky-600 hover:text-sky-700 font-bold transition-colors">Sign in</a>
        </p>
    </div>
    <script src="source/api.js"></script>
    <script>
        const form = document.getElementById('forgot-password-form');
        const emailInput = document.getElementById('email');
        const message = document.getElementById('form-message');
        const submitButton = form.querySelector('button[type="submit"]');

        form.addEventListener('submit', async function (e) {
            e.preventDefault();
            message.classList.add('hidden');
            submitButton.disabled = true;
            submitButton.textContent = 'Sending...';

            try {
                const data = await apiFetch('forgot_password.php', {
                    method: 'POST',
                    body: JSON.stringify({ email: emailInput.value }),
                });
                message.textContent = data.message;
                message.classList.remove('hidden', 'text-red-500');
                message.classList.add('text-green-600');
            } catch (err) {
                message.textContent = err.message || 'Enter a valid email address.';
                message.classList.remove('hidden', 'text-green-600');
                message.classList.add('text-red-500');
            } finally {
                submitButton.disabled = false;
                submitButton.textContent = 'Send Reset Link';
            }
        });

        const btn = document.getElementById('mobile-menu-button');
        const menu = document.getElementById('mobile-menu');

        btn.addEventListener('click', () => {
            menu.classList.toggle('hidden');
        });
    </script>
</body>

</html>
